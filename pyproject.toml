[project]
name = "piv-channel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "imagecodecs>=2026.8.16",
    "lvpyio>=1.4.0",
    "marimo>=0.24.0",
    "pandas>=3.0.5",
    "pivpy>=0.2.0",
    "scikit-image>=0.26.0",
]

[tool.uv.sources]
pivpy = { path = "../pivpy", editable = true }

[dependency-groups]
dev = [
    "mcp>=1",
    "nbformat>=5.11.1",
    "openai>=3.8.0",
    "pydantic>=2",
    "python-lsp-ruff>=2.3.3",
    "python-lsp-server>=1.15.0",
    "ruff>=0.16.6",
    "websockets>=16.1.1",
]
